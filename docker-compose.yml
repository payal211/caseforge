# Local PostgreSQL for case storage:  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: caseforge
      POSTGRES_PASSWORD: caseforge
      POSTGRES_DB: caseforge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseforge"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
